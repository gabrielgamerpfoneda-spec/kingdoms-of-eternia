<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kingdoms of Eternia</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#07060c;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#f1e6c8}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0b0912}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px #ffb43c88)}50%{filter:drop-shadow(0 0 26px #ffd86bcc)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#bgc{position:absolute;inset:0}
.logo{position:absolute;left:0;right:0;top:20px;text-align:center;animation:glow 4s infinite}
.logo canvas{margin:0 auto 4px;animation:floaty 5s infinite ease-in-out}
.logo h1{font:900 62px Georgia,serif;letter-spacing:5px;color:#ffd86b;text-shadow:0 3px 0 #b8741e,0 6px 0 #6a3410,0 9px 0 #2b1406,0 0 30px #ffa03c99}
.logo h2{font:700 22px Georgia,serif;letter-spacing:22px;color:#d6ecff;text-shadow:0 2px 0 #14284a;margin-top:2px}
.menucol{position:absolute;left:50%;top:214px;width:340px;margin-left:-170px;display:flex;flex-direction:column;gap:7px}
.menucol .btn{padding:8px 18px;font-size:16px}
.btn{font:700 17px Georgia,serif;color:#fff2cf;background:linear-gradient(#6a4a2a,#3d2813);border:3px solid #c9a050;border-radius:6px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #1d1208,inset 0 0 0 2px #00000055;transition:transform .12s,filter .12s,box-shadow .12s;text-shadow:0 2px 0 #000a;letter-spacing:1px}
.btn:hover{transform:translateY(-3px) scale(1.02);filter:brightness(1.25);box-shadow:0 7px 0 #1d1208,0 0 18px #ffcc5588}
.btn:active{transform:translateY(2px)}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none;box-shadow:0 4px 0 #1d1208}
.btn.sm{font-size:13px;padding:5px 10px;border-width:2px}
.btn.green{background:linear-gradient(#58a03f,#2b5a1f)}
.btn.red{background:linear-gradient(#b04040,#5e1a1a)}
.btn.blue{background:linear-gradient(#4a6ab0,#233a70)}
.btn.on{filter:brightness(1.35);border-color:#fff2a0}
.panel{position:absolute;left:50px;right:50px;top:30px;bottom:30px;background:linear-gradient(#2a1d12ee,#170f09f4);border:4px solid #c9a050;border-radius:10px;box-shadow:0 0 0 3px #000,0 20px 60px #000c;padding:20px 26px;overflow:auto}
.panel h2{font:900 30px Georgia,serif;color:#ffd86b;text-shadow:0 3px 0 #5a2e0c;margin-bottom:12px;letter-spacing:2px}
.panel .back{position:absolute;right:20px;top:16px}
.panel::-webkit-scrollbar{width:10px}.panel::-webkit-scrollbar-thumb{background:#c9a050;border-radius:5px}
.grid{display:grid;gap:12px}
.card{background:linear-gradient(#3b2a1b,#241810);border:2px solid #7a5a30;border-radius:8px;padding:10px;position:relative;transition:transform .15s,border-color .15s}
.card.click{cursor:pointer}.card.click:hover{transform:translateY(-3px);border-color:#ffd86b}
.card.lock{filter:grayscale(.9) brightness(.55)}
.card.sel{border-color:#ffd86b;box-shadow:0 0 14px #ffd86b88}
.tag{display:inline-block;font:700 11px sans-serif;background:#00000088;border-radius:4px;padding:2px 6px;margin-right:4px;color:#ffe9a8}
.small{font-size:13px;color:#d8c9a4;line-height:1.35}
.gold{color:#ffd86b}.red{color:#ff7a6a}.grn{color:#8ae26a}.blu{color:#8ab8ff}
.bar{height:10px;background:#00000099;border-radius:5px;overflow:hidden;border:1px solid #000}
.bar>i{display:block;height:100%;background:linear-gradient(#8ae26a,#3a9a2a);transition:width .3s}
select,input[type=text],input[type=password]{font:600 15px Georgia,serif;background:#1b120a;color:#ffeabb;border:2px solid #c9a050;border-radius:5px;padding:6px 8px;user-select:text}
input[type=range]{accent-color:#e0a030;width:220px}
.row{display:flex;align-items:center;gap:12px;margin:8px 0}
/* HUD */
#game{background:#000}
#hud{position:absolute;left:0;top:0;width:1280px;height:64px;background:linear-gradient(#3a2816,#1d130a);border-bottom:4px solid #c9a050;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:3}
.stat{display:flex;align-items:center;gap:7px;font:700 20px Georgia,serif;min-width:96px;background:#00000066;border:2px solid #7a5a30;border-radius:6px;padding:4px 10px;height:40px}
.ic{width:22px;height:22px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;display:inline-block;flex:none}
#wbarw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px}
#wbarw .bar{height:14px}#wbar{background:linear-gradient(#ffc84a,#c97a10)!important}
#wtxt{font:700 12px Georgia;color:#d8c9a4;text-align:center}
#cv{position:absolute;left:0;top:64px;cursor:crosshair}
#side{position:absolute;left:960px;top:64px;width:320px;height:656px;background:linear-gradient(#2a1d12,#150e08);border-left:4px solid #c9a050;padding:8px;display:flex;flex-direction:column;gap:6px}
#cats{display:flex;gap:3px}
#cats .btn{flex:1;padding:6px 0;font-size:11px;border-width:2px;letter-spacing:0}
#tlist{display:flex;flex-direction:column;gap:4px}
.tcard{display:flex;align-items:center;gap:8px;height:50px;background:linear-gradient(#3b2a1b,#241810);border:2px solid #7a5a30;border-radius:6px;padding:0 8px;cursor:pointer;transition:.12s}
.tcard:hover{border-color:#ffd86b;filter:brightness(1.2)}
.tcard.sel{border-color:#ffd86b;box-shadow:0 0 10px #ffd86b99}
.tcard.cant{opacity:.55}.tcard.lock{filter:grayscale(1) brightness(.5)}
.tcard .nm{font:700 13px Georgia;flex:1}.tcard .pr{font:700 14px Georgia;color:#ffd86b}
#info{flex:1;background:#0e0a06;border:2px solid #5a4020;border-radius:6px;padding:8px;overflow:hidden;font-size:12.5px;line-height:1.35}
#info h3{font:900 16px Georgia;color:#ffd86b;margin-bottom:2px}
.srow{display:flex;align-items:center;gap:6px;margin:2px 0}.srow b{width:62px;color:#c9b890;font-weight:600}.srow .bar{flex:1;height:8px}.srow span{width:50px;text-align:right}
#strip{position:absolute;left:0;top:688px;width:960px;height:32px;background:linear-gradient(#1d130a,#0e0a06);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:#d8c9a4;border-top:2px solid #5a4020}

.ov{position:absolute;inset:0;background:#000a;z-index:6;display:none;align-items:center;justify-content:center}

.dlg h1{font:900 44px Georgia,serif;margin-bottom:10px;letter-spacing:3px}
.dlg .btn{margin:6px 4px}
#toasts{position:absolute;right:16px;top:74px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:linear-gradient(#4a3420,#2a1c10);border:2px solid #ffd86b;border-radius:8px;padding:8px 14px;font:700 14px Georgia;animation:pop .3s;box-shadow:0 0 18px #000a;min-width:220px}
.stars{font-size:0;margin:6px 0}.stars canvas{display:inline-block;width:48px;height:48px;margin:0 4px}
pre{background:#0b0805;border:1px solid #5a4020;padding:10px;font:12px Consolas,monospace;color:#bfe6a0;overflow:auto;user-select:text;white-space:pre;border-radius:6px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #4a3418;padding:4px 8px;text-align:left;font-size:13px}
th{color:#ffd86b}
/* gacha */
.rc{--c:#aaa}
.gcard{width:132px;height:196px;perspective:700px;display:inline-block;margin:6px}
.gcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);animation:gflip .7s forwards}
.gcard .f,.gcard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:9px;border:3px solid var(--c);padding:6px;text-align:center}
.gcard .b{background:repeating-linear-gradient(45deg,#2a1d3a,#2a1d3a 8px,#3a2a52 8px,#3a2a52 16px);transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;font:900 40px Georgia;color:#ffd86b}
.gcard .f{background:linear-gradient(#3b2a1b,#1d130c);box-shadow:0 0 18px var(--c),inset 0 0 20px #0008}
.gcard .f.big{animation:gpulse 1.2s infinite alternate}
.gcard .f .nm{font:700 13px Georgia;margin-top:2px}.gcard .f .rl{font:900 11px Georgia;letter-spacing:1px;color:var(--c)}
.gcard .f .nw{position:absolute;top:-9px;left:-9px;background:#e8402a;color:#fff;font:900 11px Georgia;padding:2px 6px;border-radius:5px;transform:rotate(-8deg)}
.gcard.sm{width:98px;height:152px;margin:3px}
.gcard.sm .f{padding:3px}.gcard.sm .f img{width:46px;height:69px}.gcard.sm .f .nm{font-size:10.5px;line-height:1.1}.gcard.sm .f .rl{font-size:9px}.gcard.sm .f .small{font-size:10px;margin-top:1px!important}.gcard.sm .f .nw{font-size:9px;top:-7px;left:-7px}.gcard.sm .b{font-size:30px}
@keyframes gflip{from{transform:rotateY(180deg) scale(.8)}60%{transform:rotateY(-12deg) scale(1.12)}to{transform:rotateY(0) scale(1)}}
@keyframes gpulse{from{box-shadow:0 0 14px var(--c)}to{box-shadow:0 0 40px var(--c),0 0 70px var(--c)}}
@keyframes gflash{0%{opacity:.9}100%{opacity:0}}
.gflash{position:absolute;inset:0;pointer-events:none;animation:gflash .9s forwards;z-index:30}

/* conta / multiplayer */
#acctchip{position:absolute;right:18px;top:14px;display:flex;align-items:center;gap:8px;background:#000000aa;border:2px solid #7a5a30;border-radius:8px;padding:6px 12px;cursor:pointer;font:700 14px Georgia;color:#ffe9a8;z-index:5}
#acctchip:hover{border-color:#ffd86b}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#777;box-shadow:0 0 6px #0008;vertical-align:middle;margin-right:5px}
.dot.ok{background:#4ae04a;box-shadow:0 0 8px #4ae04a}.dot.warn{background:#ffc83a;box-shadow:0 0 8px #ffc83a}.dot.bad{background:#ff4a3a;box-shadow:0 0 8px #ff4a3a}
.pslot{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid #4a3620;border-radius:6px;margin:4px 0;background:#00000044;min-height:36px}
.pslot .sw{width:14px;height:14px;border-radius:3px;border:1px solid #000;flex:none}
.pslot.off{opacity:.55}
.err{color:#ff7a6a;font-size:13px;min-height:18px;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs .btn.on{border-color:#ffd86b;background:linear-gradient(#8a5a2a,#4a2a10)}
#recon{position:absolute;left:0;top:64px;width:960px;height:656px;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;font:900 28px Georgia;color:#ffd86b}
#recon.on{display:flex}
#hnet{margin-left:auto;font:700 12px Georgia;color:#d8c9a4;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
<canvas id="bgc" width="1280" height="720"></canvas>
<div id="scr-menu" class="screen"></div>
<div id="scr-gacha" class="screen"></div>
<div id="scr-maps" class="screen"></div>
<div id="scr-towers" class="screen"></div>
<div id="scr-upg" class="screen"></div>
<div id="scr-ach" class="screen"></div>
<div id="scr-set" class="screen"></div>
<div id="scr-cred" class="screen"></div>

<div id="ov" class="ov"></div>
<div id="toasts"></div>
</div>
<script>window.ETERNIA_CONFIG={server:"__ETERNIA_SERVER_URL__"};</script>
<script>
'use strict';
/* =====================================================================
   KINGDOMS OF ETERNIA — arquivo único. Módulos: Core, Dados, Sprites,
   Motor (Game), Interface (UI), Rede (Net).
   Versão do protocolo online: cliente e servidor precisam ter o mesmo PROTOCOL.
   ===================================================================== */
/* ============================ CORE ================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const TILE=48,COLS=20,ROWS=13,MW=COLS*TILE,MH=ROWS*TILE;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return[c,x]}
const fmt=n=>n>=10000?(n/1000).toFixed(1)+'k':String(Math.floor(n));
const VERSION='2.0.0',PROTOCOL=2;
let G=null;

/* ---------- Save (LocalStorage) ---------- */
const Save=(()=>{
 const KEY='kingdoms_of_eternia_v1';
 const def=()=>({xp:0,level:1,coins:100,owned:{0:1,5:1,10:1},gacha:{pulls:0,sinceEpic:0},mapsWon:{},stars:{},best:{},upg:{},ach:{},hist:[],claimed:[],acct:'',
  stats:{kills:0,wins:0,losses:0,built:0,bosses:0,gold:0,games:0,waves:0,upgrades:0,bestWave:0},
  set:{master:.7,music:.5,sfx:.7,range:true,shake:true,auto:false,unlockAll:false,name:'Herói'},run:null});
 let d=def();
 function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k]);else a[k]=b[k]}return a}
 function load(){try{const s=localStorage.getItem(KEY);if(s)d=merge(def(),JSON.parse(s))}catch(e){d=def()}}
 function save(){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}try{Acct.queue()}catch(e){}}
 function reset(){d=def();save()}
 /* ---- perfil da conta: tudo que é progresso do jogador (sem partida em andamento) ---- */
 const profile=()=>{const p=JSON.parse(JSON.stringify(d));delete p.run;delete p.acct;if(p.set)delete p.set.unlockAll;return p};
 const activity=p=>((p.stats&&p.stats.games)||0)+((p.gacha&&p.gacha.pulls)||0)+Object.values(p.upg||{}).reduce((a,b)=>a+b,0)+Object.keys(p.owned||{}).length+Object.keys(p.ach||{}).length;
 function apply(p){const run=d.run,ua=d.set.unlockAll,ac=d.acct;d=merge(def(),p);d.run=run;d.set.unlockAll=ua;d.acct=ac;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
 /* une dois perfis sem perder nada: posses/mapas/conquistas = união; recordes = máximo;
    moedas/nível/melhorias/sorteios vêm do perfil com mais atividade (evita "ressuscitar" moedas gastas) */
 function mergeProfiles(a,b){
  const hi=activity(a)>=activity(b)?a:b,lo=hi===a?b:a,o=JSON.parse(JSON.stringify(hi));
  const U=(k)=>{o[k]=Object.assign({},lo[k]||{},hi[k]||{})},M=(k)=>{o[k]=Object.assign({},lo[k]||{});for(const i in(hi[k]||{}))o[k][i]=Math.max(o[k][i]||0,hi[k][i])};
  U('owned');U('mapsWon');U('ach');M('stars');M('best');
  o.stats={};for(const k in Object.assign({},a.stats,b.stats))o.stats[k]=Math.max((a.stats||{})[k]||0,(b.stats||{})[k]||0);
  o.claimed=[...new Set([...(lo.claimed||[]),...(hi.claimed||[])])].slice(-30);
  o.hardWin=!!(a.hardWin||b.hardWin);o.extWin=!!(a.extWin||b.extWin);o.perfectWin=!!(a.perfectWin||b.perfectWin);
  o.hist=[...(lo.hist||[]),...(hi.hist||[])].slice(-25);
  return o;
 }
 const xpNeed=l=>Math.round(100*Math.pow(l,1.4));
 function addXP(n){let up=0;d.xp+=n;while(d.level<30&&d.xp>=xpNeed(d.level)){d.xp-=xpNeed(d.level);d.level++;up++}if(d.level>=30)d.xp=Math.min(d.xp,xpNeed(30));return up}
 return{get d(){return d},load,save,reset,xpNeed,addXP,upg:k=>d.upg[k]||0,profile,apply,activity,mergeProfiles};
})();
Save.load();

/* ---------- Áudio sintetizado (WebAudio) ---------- */
const SCALES={minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],phryg:[0,1,3,5,7,8,10],major:[0,2,4,5,7,9,11],hmin:[0,2,3,5,7,8,11],lyd:[0,2,4,6,7,9,11]};
const Sound=(()=>{
 let ctx=null,master,mG,sG,tmr=null,step=0,next=0,pat=null,cur='',pending=null,last={},nbuf=null;
 const mtof=m=>440*Math.pow(2,(m-69)/12);
 function init(){
  if(ctx){if(ctx.state==='suspended')ctx.resume();return}
  try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=ctx.createGain();mG=ctx.createGain();sG=ctx.createGain();mG.connect(master);sG.connect(master);master.connect(ctx.destination);vol();
  nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
  if(pending){const p=pending;pending=null;music(p[0],p[1])}
 }
 function vol(){if(!ctx)return;const s=Save.d.set;master.gain.value=s.master;mG.gain.value=s.music*.55;sG.gain.value=s.sfx}
 function tone(f,d,type='square',v=.15,dest=null,t0=0,slide=0){
  if(!ctx)return;dest=dest||sG;const t=ctx.currentTime+Math.max(0,t0),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.03);
 }
 function noise(d,v=.2,fr=2000,dest=null,t0=0,type='lowpass'){
  if(!ctx)return;dest=dest||sG;const t=ctx.currentTime+Math.max(0,t0),s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=nbuf;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.03);
 }
 const SFX={
  arrow:()=>{noise(.08,.12,3500,null,0,'highpass');tone(900,.07,'triangle',.08,null,0,-500)},
  magic:()=>{tone(620,.18,'sine',.12,null,0,500);tone(930,.14,'triangle',.06)},
  fire:()=>{noise(.25,.2,900);tone(220,.2,'sawtooth',.06,null,0,-100)},
  ice:()=>{tone(1400,.2,'sine',.1,null,0,-700);tone(2100,.12,'triangle',.05)},
  zap:()=>{noise(.15,.18,6000,null,0,'highpass');tone(180,.15,'sawtooth',.09,null,0,500)},
  cannon:()=>{noise(.3,.35,500);tone(90,.25,'sine',.35,null,0,-50)},
  boom:()=>{noise(.45,.4,420);tone(70,.35,'sine',.35,null,0,-40)},
  hit:()=>{noise(.05,.08,1800)},
  die:()=>{tone(300,.18,'square',.07,null,0,-200);noise(.1,.08,900)},
  build:()=>{tone(300,.08,'square',.1);tone(450,.12,'square',.1,null,.07)},
  upgrade:()=>{[392,494,587,784].forEach((f,i)=>tone(f,.14,'triangle',.12,null,i*.07))},
  sell:()=>{tone(700,.1,'square',.09);tone(500,.12,'square',.09,null,.08)},
  coin:()=>{tone(1320,.08,'square',.06);tone(1760,.12,'square',.06,null,.05)},
  click:()=>{tone(520,.05,'square',.07)},
  wave:()=>{[196,262,330].forEach((f,i)=>tone(f,.28,'sawtooth',.1,null,i*.12))},
  leak:()=>{tone(150,.3,'sawtooth',.18,null,0,-60);noise(.2,.15,300)},
  heal:()=>{[523,659,784].forEach((f,i)=>tone(f,.2,'sine',.1,null,i*.08))},

function ell(g,cx,cy,rx,ry,col,u=3){g.fillStyle=col;for(let y=-ry;y<=ry;y+=u){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry)))/u)*u;if(w>0)g.fillRect(cx-w,cy+y,2*w,u)}}
function glowAt(g,x,y,r,col,a=.5){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=a;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}

/* ---------- Corpo das torres (24x34, desenhado em 2x) ---------- */
function towerBody(d,lvl){
 const key=d.id*4+lvl;if(Spr.bodies[key])return Spr.bodies[key];
 const[c,x]=mk(24,34),S=d.stone,dk=shade(S,-.35),lt=shade(S,.22),W=[14,16,18][lvl-1],H=[10,13,16][lvl-1];
 const x0=12-W/2,yb=30,yt=yb-H,cat=d.cat;
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(x0-3,31,W+6,3);
 R(x,x0-2,28,W+4,3,dk);R(x,x0-1,27,W+2,1,lt);
 R(x,x0,yt,W,yb-yt,S);R(x,x0,yt,2,yb-yt,lt);R(x,x0+W-3,yt,3,yb-yt,dk);
 for(let y=yt+3;y<yb;y+=4){R(x,x0,y,W,1,dk);const off=(((y-yt)/4)|0)%2*3;for(let bx=x0+off+3;bx<x0+W-3;bx+=6)R(x,bx,y-3,1,3,dk)}
 const cr=shade(S,.05);R(x,x0-1,yt-3,W+2,3,cr);R(x,x0-1,yt-3,W+2,1,lt);
 for(let bx=x0-1;bx<x0+W+1;bx+=4)R(x,bx,yt-5,2,2,cr);
 // categoria: detalhes
 if(cat===0){R(x,x0,yt+2,W,2,'#6a4a2a');R(x,x0,yt+2,W,1,'#8a6a3a')}           // vigas de madeira
 if(cat===1){for(let i=0;i<lvl+1;i++){R(x,x0+3+i*4,yt+4+(i%2)*3,1,2,d.glow)}}     // runas
 if(cat===2){for(let bx=x0+2;bx<x0+W-2;bx+=4){R(x,bx,yb-3,1,1,'#bbb');R(x,bx,yt+3,1,1,'#bbb')}} // rebites
 if(cat===3){R(x,x0,yt+2,W,3,d.acc);R(x,x0,yt+2,W,1,shade(d.acc,.3))}            // faixa
 if(cat===4){R(x,x0,yt+2,W,2,d.acc);R(x,x0+2,yt+6,1,2,d.glow);R(x,x0+W-3,yt+6,1,2,d.glow)}
 // porta e fresta
 R(x,10,yb-6,4,6,'#1b1210');R(x,11,yb-7,2,1,'#1b1210');R(x,12,yb-2,1,2,'#3a2a22');
 R(x,11,yt+5,2,3,'#14101a');
 // nível 2: faixa colorida + bandeirola
 if(lvl>=2){R(x,x0,yt+(cat===0?5:2),W,1,d.acc);const px=x0+W-1;R(x,px,yt-13,1,9,'#5a4028');R(x,px+1,yt-13,5,3,d.acc);R(x,px+1,yt-13,5,1,shade(d.acc,.35));R(x,px+4,yt-12,2,1,shade(d.acc,-.3))}
 // nível 3: dourado e gema
 if(lvl>=3){const gold='#ffd35a';R(x,x0-1,yt-3,W+2,1,gold);for(let bx=x0-1;bx<x0+W+1;bx+=4)R(x,bx,yt-5,2,1,gold);R(x,x0,yb-9,W,1,gold);R(x,11,yb-9,2,2,d.glow);R(x,x0-2,yb-9,2,6,'#3a2a1a');R(x,x0-2,yb-10,2,1,d.glow);R(x,x0+W,yb-9,2,6,'#3a2a1a');R(x,x0+W,yb-10,2,1,d.glow)}
 return Spr.bodies[key]={c,top:yt-3};
}

function orbDraw(c,x,y,kind,col,sz,tm,rec){
 const{g,P}=c;P(x,y,sz,sz,col);P(x,y,1,1,'#fff');
 if(kind==='fire'){P(x+(Math.sin(tm*9)>0?0:1),y-2,1,2,'#ffd35a');P(x,y-3+(Math.sin(tm*11)>0?0:1),1,1,'#ff8a2a')}
 if(kind==='ice'){P(x,y-2,1,2,'#fff');P(x-1,y+1,1,1,'#8af0ff');P(x+2,y+1,1,1,'#8af0ff')}

/* ---------- Conexão multiplayer (WebSocket) ---------- */
const myCid=(()=>{let c=SS.get('eternia_cid');if(!c||!/^[A-Za-z0-9]{8,40}$/.test(c)){c=Array.from(crypto.getRandomValues(new Uint8Array(14)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');SS.set('eternia_cid',c)}return c})();
const DENY={gold:'Ouro insuficiente.',cell:'Posição inválida.',locked:'Você não possui essa torre.',owner:'Só o dono da torre ou o anfitrião pode vender.',host:'Só o anfitrião pode fazer isso.',bad:'Ação inválida.'};
const Net={
 ws:null,state:'off',reconnecting:false,status:'',code:'',slot:-1,hostId:-1,players:[],map:0,diff:'normal',phase:'lobby',ping:0,guest:true,towers:[],account:null,
 lastMsg:0,lastSnap:0,_want:false,_fatal:false,_tries:0,_rt:null,_pingT:null,_hold:null,
 get online(){return this.state==='on'},
 get isHost(){return this.slot>=0&&this.slot===this.hostId},
 ownedList(){return Save.d.set.unlockAll?TOWERS.map(t=>t.id):Object.keys(Save.d.owned).map(Number)},
 connect(){
  if(this.state==='on')return Promise.resolve();
  if(this._hold)return this._hold;
  const url=Cfg.ws();if(!url)return Promise.reject(new Error('Servidor não configurado. Informe o endereço do servidor.'));
  this.state='connecting';this._fatal=false;this.status='Conectando…';UI.mpRender();
  this._hold=new Promise((res,rej)=>{
   let done=false,ws;const fail=m=>{if(done)return;done=true;this._hold=null;this.state='off';try{ws&&ws.close()}catch(e){}rej(new Error(m))};
   try{ws=new WebSocket(url)}catch(e){return fail('Endereço de servidor inválido.')}
   this.ws=ws;const to=setTimeout(()=>fail('O servidor não respondeu (pode estar iniciando — tente de novo em alguns segundos).'),9000);
   ws.onopen=()=>ws.send(JSON.stringify({t:'hello',v:PROTOCOL,cid:myCid,name:Save.d.set.name,owned:this.ownedList(),token:Acct.token||undefined}));
   ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}this.lastMsg=Date.now();
    if(m.t==='welcome'&&!done){done=true;clearTimeout(to);this._hold=null;this.state='on';this._tries=0;this.reconnecting=false;this.guest=!!m.guest;this.towers=m.towers||[];this.account=m.account;this.status='Conectado';
     clearInterval(this._pingT);this._pingT=setInterval(()=>this.tick(),2000);this.sendPing();
     if(this._want&&!m.inRoom)this._lost('Você foi desconectado da sala (tempo esgotado).');
     UI.mpRender();res()}
    else if(m.t==='err'&&m.fatal&&!done){this._fatal=true;fail(m.msg)}
    else this.recv(m)};
   ws.onclose=()=>{clearTimeout(to);if(!done)fail('Não foi possível conectar ao servidor.');if(this.ws===ws)this._closed()};
   ws.onerror=()=>{};
  });
  return this._hold;
 },
 _closed(){
  clearInterval(this._pingT);this.ws=null;if(this.state==='on'||this.state==='connecting')this.state='off';
  if(this._want&&!this._fatal)this._reconnect();else{this.status='Desconectado';UI.mpRender()}
 },
 _reconnect(){
  if(this._rt)return;const n=++this._tries;
  if(n>10){this._lost('Não foi possível reconectar ao servidor.');return}
  this.reconnecting=true;this.status='Reconectando… ('+n+'/10)';UI.mpRender();
  this._rt=setTimeout(()=>{this._rt=null;this.connect().catch(()=>{if(this._want)this._reconnect()})},Math.min(5000,700*n));
 },
 _lost(msg){   // perdemos a sala de vez
  this._want=false;this.reconnecting=false;this._tries=0;this.code='';this.players=[];this.slot=-1;this.hostId=-1;
  if(G&&G.remote){UI.leaveGame();toast('<b class="red">Partida encerrada</b><br>'+esc(msg||''))}else if(msg)toast(esc(msg));
  UI.mpRender();
 },
 tick(){
  if(this.state!=='on')return;
  if(Date.now()-this.lastMsg>14000){try{this.ws.close()}catch(e){}return}   // conexão "meio morta": força reconexão
  this.sendPing();
 },
 sendPing(){this.send({t:'ping',ts:Date.now(),rtt:this.ping})},
 send(o){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(o))},
 recv(m){
  switch(m.t){
   case'pong':this.ping=Math.max(1,Date.now()-m.ts);try{UI.acctChip();if(curScr==='game')UI.hudNet()}catch(e){}break;
   case'joined':this.code=m.code;this.slot=m.slot;this._want=true;break;
   case'room':this.players=m.players;this.hostId=m.hostId;this.map=m.map;this.diff=m.diff;this.phase=m.phase;if(G&&G.remote)G.players=this.players;UI.mpRender();break;
   case'start':UI.startNet(m);break;
   case'snap':this.lastSnap=Date.now();if(G&&G.remote&&G.gid===m.gid)G.applySnap(m);break;
   case'deny':Sound.sfx('err');toast(esc(DENY[m.why]||'Ação recusada.'));if(G&&G.remote)G.pendingSel=null;break;
   case'err':this.status=m.msg;toast('<b class="red">'+esc(m.msg)+'</b>');UI.mpRender();break;
   case'left':this._lost(m.reason);break;
  }
 },
 /* ---- ações ---- */
 async create(map,diff){await this.connect();this.send({t:'create',map,diff})},
 async join(code){await this.connect();this.send({t:'join',code})},
 leave(){this._want=false;this.send({t:'leave'});this.code='';this.players=[];this.slot=-1;this.hostId=-1;this.phase='lobby'},
 disconnect(){this._want=false;this._fatal=true;clearTimeout(this._rt);this._rt=null;this.reconnecting=false;if(this.ws){try{this.ws.close()}catch(e){}}this.ws=null;this.state='off';this.code='';this.players=[];this.slot=-1;this.status='Desconectado'},
 invite(){
  const q=new URLSearchParams();q.set('room',this.code);
  const b=Cfg.base();if(b&&!(location.origin===b))q.set('server',b);
  return/^https?:$/.test(location.protocol)?location.origin+location.pathname+'?'+q:''
 }
};

 else if(a.k==='speed')g.speed=a.v;

/* ---------- Tela de jogo ---------- */
let cat=0,lastSig='',hudT=0,resultShown=false;
UI.startGame=function(mi,diff,resume,opt={}){
 const ov=$('#ov');ov.classList.remove('on');resultShown=false;
 G=resume&&Save.d.run?Game.resume(Save.d.run):new Game(mi,diff,opt.remote?{remote:true,net:true,coop:opt.coop||1,slot:opt.slot,players:opt.players||[]}:{});
 if(opt.remote){G.gid=opt.gid;if(opt.blocked)G.blk=new Set(opt.blocked)}
 if(!resume&&!opt.remote){Save.d.run=null;Save.save()}
 buildGameScreen();show('game');Sound.music('battle',G.M.mus);
 if(G.wave===0)G.banner={txt:G.M.name,t:2.6,col:'#ffd86b'};
 lastSig='';
};
UI.leaveGame=function(){const was=G&&G.remote;G=null;resultShown=false;$('#ov').classList.remove('on');show(was&&Net.code?'mp':'menu')};
function buildGameScreen(){
 const el=$('#scr-game'),ic=n=>`background-image:url(${Icons(n)})`;
 el.innerHTML=`<div id="hud">
 <div class="stat"><i class="ic" style="${ic('coin')}"></i><span id="hGold">0</span></div><div class="stat"><i class="ic" style="${ic('heart')}"></i><span id="hLives">0</span></div>
 <div class="stat" style="min-width:110px"><i class="ic" style="${ic('flag')}"></i><span id="hWave">0/0</span></div><div class="stat"><i class="ic" style="${ic('skull')}"></i><span id="hEn">0</span></div>
 <div id="wbarw"><div class="bar"><i id="wbar" style="width:0"></i></div><div id="wtxt"></div></div>
 <button class="btn green sm" id="bNext">Próxima Wave</button><button class="btn sm" id="bPause">Pausa</button>
 <button class="btn sm" data-sp="1">1x</button><button class="btn sm" data-sp="2">2x</button><button class="btn sm" data-sp="3">3x</button><button class="btn sm" id="bAuto">Auto</button><button class="btn red sm" id="bQuit">Sair</button></div>
 <canvas id="cv" width="${MW}" height="${MH}"></canvas>
 <div id="strip"><span id="sMsg">Escolha uma torre no painel e clique no mapa para construir.</span><span style="flex:1"></span><span>Próxima wave:</span><span id="nxt" style="display:flex;gap:6px;align-items:center"></span></div>
 <div id="side"><div id="cats"></div><div id="tlist"></div><div id="info"></div></div>`;
 const cats=$('#cats');CATS.forEach((c,i)=>{const b=document.createElement('button');b.className='btn sm'+(i===cat?' on':'');b.textContent=c.name;b.style.borderColor=c.col;b.onclick=()=>{click();cat=i;lastSig='';cats.querySelectorAll('.btn').forEach((x,k)=>x.classList.toggle('on',k===i))};cats.appendChild(b)});
 $('#bNext').onclick=()=>{click();act({k:'wave'})};$('#bPause').onclick=()=>{click();act({k:'pause'})};
 $$('[data-sp]').forEach(b=>b.onclick=()=>{click();act({k:'speed',v:+b.dataset.sp})});
 $('#bAuto').onclick=()=>{click();act({k:'auto'})};
 $('#bQuit').onclick=()=>{click();if(G&&G.paused!==true&&!G.remote)G.paused=true;UI.quitDialog()};
 const cv=$('#cv');
 const cell=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(MW/r.width),y=(e.clientY-r.top)*(MH/r.height);return{c:Math.floor(x/TILE),r:Math.floor(y/TILE)}};
 cv.onmousemove=e=>{if(G)G.hover=cell(e)};cv.onmouseleave=()=>{if(G)G.hover=null};
 cv.onmousedown=e=>{if(!G||G.over)return;const{c,r}=cell(e);
  if(e.button===2){G.build=null;G.sel=null;lastSig='';return}
  if(G.build!==null){const def=TOWERS[G.build];if(!G.unlocked(def)){Sound.sfx('err');return}
   if(G.canBuild(c,r)){if(G.gold>=G.cost(def)){act({k:'build',id:G.build,c,r});if(!G.remote&&!e.shiftKey){G.build=null}}else{Sound.sfx('err');$('#sMsg').textContent='Ouro insuficiente.'}}
   else{const t=G.cellT.get(c+','+r);if(t){G.sel=t;G.build=null}else Sound.sfx('err')}lastSig='';return}
  const t=G.cellT.get(c+','+r);G.sel=t||null;if(t)Sound.sfx('click');lastSig=''};
 cv.oncontextmenu=e=>e.preventDefault();
}
UI.quitDialog=function(){
 const ov=$('#ov');ov.innerHTML=`<div class="dlg"><h1 class="gold">Sair da partida?</h1><div class="small" style="margin-bottom:10px">${G&&!G.remote?'Seu progresso é salvo ao final de cada wave e você poderá continuar depois.':'Você sairá da sala. (Se fechar a página sem sair, você tem 90 s para voltar.)'}</div><button class="btn red" id="qY">Sair para o menu</button><button class="btn green" id="qN">Continuar jogando</button></div>`;ov.classList.add('on');
 $('#qY').onclick=()=>{click();ov.classList.remove('on');const rem=G&&G.remote;if(rem)Net.leave();G=null;resultShown=false;show(rem?'mp':'menu')};
 $('#qN').onclick=()=>{click();ov.classList.remove('on');if(G&&!G.remote)G.paused=false};
};
function statBars(def,st,g,t){
 const dm=t?g.dmgOf(t):st.dmg*(1+Save.upg('dmg')*.02),rg=t?g.rng(t)/TILE:st.range*(1+Save.upg('range')*.02),rt=t?g.rateOf(t):st.rate;
 const bar=(n,v,mx,txt,col)=>`<div class="srow"><b>${n}</b><div class="bar"><i style="width:${clamp(v/mx*100,2,100)}%;background:${col}"></i></div><span>${txt}</span></div>`;
 const none=['heal','mine','aura','summon'].includes(st.atk);
 return(none?'':bar('Dano',dm,220,Math.round(dm)+(st.shots>1&&st.atk!=='multi'?'×'+st.shots:''),'linear-gradient(#ff8a6a,#c03a2a)'))+bar('Alcance',rg,7,rg.toFixed(1),'linear-gradient(#8ac8ff,#2a6ad0)')+(none?'':bar('Veloc.',rt,3.2,rt.toFixed(2)+'/s','linear-gradient(#ffe08a,#c9901a)'));
}
function extras(st){
 const o=[];if(st.crit)o.push(`Crítico ${Math.round(st.crit[0]*100)}% (×${st.crit[1]})`);if(st.poison)o.push(`Veneno ${st.poison[0]}/s por ${st.poison[1]}s`);if(st.burn)o.push(`Queimadura ${st.burn[0]}/s por ${st.burn[1]}s`);
 if(st.slow)o.push(`Lentidão ${Math.round(st.slow[0]*100)}%`);if(st.splash)o.push(`Área ${st.splash} tiles`);if(st.chain)o.push(`Corrente: ${st.chain} alvos`);if(st.shots>1)o.push(`${st.shots} projéteis`);
 if(st.hits)o.push(`Perfura ${st.hits>50?'todos':st.hits}`);if(st.stun)o.push(`Atordoa ${st.stun}s`);if(st.freeze)o.push(`${Math.round(st.freeze*100)}% congelar`);if(st.heal)o.push(`Cura ${st.heal.amt} a cada ${st.heal.every}s (máx ${st.heal.cap}/wave)`);
 if(st.atk==='mine')o.push(`+${st.gold} ouro a cada ${st.every}s`);if(st.buffDmg)o.push(`+${Math.round(st.buffDmg*100)}% dano aliado`);if(st.buffRange)o.push(`+${Math.round(st.buffRange*100)}% alcance aliado`);if(st.buffRate)o.push(`+${Math.round(st.buffRate*100)}% cadência aliada`);
 if(st.slowAura)o.push(`Aura de lentidão ${Math.round(st.slowAura*100)}%`);if(st.minion)o.push(`Até ${st.max} ${st.minion==='skel'?'esqueletos':'cavaleiros'} (${st.mhp} PV)`);if(st.minr)o.push(`Alcance mínimo ${st.minr}`);if(st.execute)o.push(`Executa < ${Math.round(st.execute*100)}% vida`);
 return o.map(x=>`<span class="tag">${x}</span>`).join('');
}
function renderSide(){
 const g=G;if(!g)return;const list=$('#tlist'),info=$('#info');if(!list)return;
 list.innerHTML='';
 TOWERS.filter(d=>d.cat===cat).forEach(d=>{const un=g.unlocked(d),cost=g.cost(d),c=document.createElement('div');c.className='tcard'+(g.build===d.id?' sel':'')+(un?(g.gold<cost?' cant':''):' lock');
  c.innerHTML=`<img src="${pv(d,1)}" width="32" height="48" style="image-rendering:pixelated;margin-top:-6px"><span class="nm">${d.name}</span><span class="pr">${un?cost:'Bloqueada'}</span>`;
  c.onclick=()=>{if(!un){Sound.sfx('err');return}click();g.build=g.build===d.id?null:d.id;g.sel=null;lastSig=''};list.appendChild(c)});
 const t=g.sel;
 if(t){
  const st=t.st,d=t.def,up=g.upgradeCost(t),sv=g.sellValue(t);
  info.innerHTML=`<h3>${d.name} <span class="tag">Nível ${t.lvl}/3</span></h3>${statBars(d,st,g,t)}<div style="margin:3px 0">${extras(st)}</div>
  <div class="small" style="margin:3px 0">${d.abil}${t.lvl<3?`<br><b class="blu">Próximo nível:</b> ${t.lvl===1?d.u2:d.u3}`:'<br><b class="grn">Nível máximo.</b>'}</div>

let lastT=performance.now();
function loop(ts){
 const real=Math.min(.1,(ts-lastT)/1000);lastT=ts;
 try{
  if(curScr==='game'&&G){
   const g=G,cv=$('#cv');
   g.anim+=real;
   if(g.remote){g.stepVisual(real);g.updateEnv(real);if(Net.state!=='on'&&Net.reconnecting)UI.reconOverlay(true);else UI.reconOverlay(false)}
   else{
    if(!g.paused&&!g.over){g.acc+=real*g.speed;let n=0;while(g.acc>=1/60&&n<8){g.step(1/60);g.acc-=1/60;n++}if(n>=8)g.acc=0;g.updateEnv(real*g.speed)}
    else g.updateEnv(real*.3);
   }
   if(g.over&&!resultShown)finish(g)
   if(cv){const c2=cv.getContext('2d');g.draw(c2);if(g.paused&&!g.over){c2.fillStyle='rgba(0,0,0,.45)';c2.fillRect(0,0,MW,MH);c2.fillStyle='#ffd86b';c2.font='900 48px Georgia';c2.textAlign='center';c2.fillText('PAUSADO',MW/2,MH/2)}}
   hudT+=real;if(hudT>.1){hudT=0;updHud()}
  }else if(curScr!=='game'){MenuScene.draw($('#bgc').getContext('2d'),ts/1000,real)}
 }catch(err){console.error(err)}
 requestAnimationFrame(loop);
}

/* ============================ SORTEIO DE TORRES ====================== */
const Gacha=(()=>{
 function pickRarity(minR=0,forceEpic=false){
  let ws=RARITY.map((r,i)=>i<minR||(forceEpic&&i<3)?0:r.w),tot=ws.reduce((a,b)=>a+b,0),t=Math.random()*tot;
  for(let i=0;i<ws.length;i++){t-=ws[i];if(t<=0)return i}return RARITY.length-1;
 }
 /* um sorteio; minR garante raridade mínima (garantia do x10) */
 function roll(minR){
  const gs=Save.d.gacha;gs.pulls++;gs.sinceEpic++;
  const pity=gs.sinceEpic>=GACHA.epicPity;
  const r=pickRarity(minR,pity);if(r>=3)gs.sinceEpic=0;
  const list=RAR_LISTS[r],id=list[Math.floor(Math.random()*list.length)],isNew=!Save.d.owned[id];
  let refund=0;if(isNew)Save.d.owned[id]=1;else{refund=RARITY[r].refund;Save.d.coins+=refund}
  return{id,r,isNew,refund,pity};
 }
 function pull(n){
  const cost=n===10?GACHA.multi:GACHA.single*n;
  if(Save.d.coins<cost)return null;
  Save.d.coins-=cost;const out=[];
  for(let i=0;i<n;i++){const left=n-i;const hasRare=out.some(o=>o.r>=2);out.push(roll(n===10&&left===1&&!hasRare?2:0))}
  Save.save();checkAch();return out;
 }
 return{pull,roll};
})();

  <div style="display:flex;gap:10px"><button class="btn green" id="g1" style="flex:1;font-size:19px" ${s.coins<GACHA.single?'disabled':''}>Sortear x1<br><span class="small">${GACHA.single} moedas</span></button>
  <button class="btn" id="g10" style="flex:1;font-size:19px;background:linear-gradient(#b07ae0,#5a2a90);border-color:#ffe08a" ${s.coins<GACHA.multi?'disabled':''}>Sortear x10<br><span class="small">${GACHA.multi} moedas · garante 1 Raro+</span></button></div>
  <div class="small" style="margin:8px 0">Garantia: a cada <b>${GACHA.epicPity}</b> sorteios sem Épico ou Lendário, o próximo é garantido (faltam <b class="gold" id="gPity">${Math.max(0,GACHA.epicPity-gs.sinceEpic)}</b>). Torres repetidas devolvem moedas. Sorteios feitos: <span id="gPulls">${gs.pulls}</span>.</div>
  <div class="card"><b>Chances</b><table>${RARITY.map((r,i)=>`<tr><td style="color:${r.col}"><b>${r.name}</b></td><td>${(r.w/tot*100).toFixed(r.w<5?1:0)}%</td><td class="small">${RAR_LISTS[i].map(id=>`<span class="gtn" data-id="${id}" style="${owns(TOWERS[id])?'':'opacity:.5'}">${TOWERS[id].name}</span>`).join(', ')}</td><td class="small">repetida: +${r.refund}</td></tr>`).join('')}</table></div>
  <div class="small" style="margin-top:8px">Você começa com Archer Tower, Apprentice Tower e Cannon Tower. Ganhe moedas vencendo partidas, derrotando chefões e completando conquistas.</div>
 </div>
 <div style="flex:1.2;position:relative"><div id="gRes" style="text-align:center;min-height:430px;padding-top:6px"><div class="small" style="margin-top:150px;font-size:16px">Faça um sorteio para descobrir novas torres!</div></div></div></div></div>`;
 $('#gBack').onclick=()=>{click();show('menu')};
 $('#g1').onclick=()=>doPull(1);$('#g10').onclick=()=>doPull(10);
 function doPull(n){
  Sound.init();const res=Gacha.pull(n);if(!res){Sound.sfx('err');return}
  Sound.sfx('coin');const box=$('#gRes');box.innerHTML='';
  const best=Math.max(...res.map(r=>r.r));
  res.forEach((r,i)=>{
   const d=TOWERS[r.id],R_=RARITY[r.r],c=document.createElement('div');c.className='gcard rc'+(n>1?' sm':'');c.style.setProperty('--c',R_.col);
   const delay=i*(n>1?.32:.2);
   c.innerHTML=`<div class="in" style="animation-delay:${delay}s"><div class="b">?</div><div class="f ${r.r>=3?'big':''}">${r.isNew?'<span class="nw">NOVA!</span>':''}${pvImg(d,r.r>=4?3:r.r>=2?2:1,n>1?46:64)}<div class="nm">${d.name}</div><div class="rl">${R_.name.toUpperCase()}</div><div class="small" style="margin-top:3px">${CATS[d.cat].name}</div>${r.isNew?'':`<div class="small gold">Repetida +${r.refund}</div>`}</div></div>`;
   // o verso fica visível antes do giro
   c.firstChild.style.transform='rotateY(180deg)';box.appendChild(c);
   setTimeout(()=>{if(curScr!=='gacha')return;Sound.sfx(r.r>=4?'legend':r.r>=3?'epic':r.r>=2?'rare':'flip');if(r.r>=3){const f=document.createElement('div');f.className='gflash';f.style.background=`radial-gradient(circle,${R_.col}cc,transparent 70%)`;$('#scr-gacha').appendChild(f);setTimeout(()=>f.remove(),1000)}},delay*1000+450);
  });
  if(best>=3)toast(`<b style="color:${RARITY[best].col}">${RARITY[best].name}!</b><br>${TOWERS[res.find(r=>r.r===best).id].name}`);
  // atualiza contadores sem recriar os cartões
  $('#gCoins').textContent=Save.d.coins;$('#gPity').textContent=Math.max(0,GACHA.epicPity-Save.d.gacha.sinceEpic);
  $('#gPulls').textContent=Save.d.gacha.pulls;$('#gOwn').textContent=ownedCount(Save.d)+'/25';$('#gOwnBar').style.width=ownedCount(Save.d)/25*100+'%';$$('.gtn').forEach(x=>x.style.opacity=owns(TOWERS[+x.dataset.id])?1:.5);$('#g1').disabled=Save.d.coins<GACHA.single;$('#g10').disabled=Save.d.coins<GACHA.multi;
 }
};
