# Render Blueprint. DATABASE_URL e ALLOWED_ORIGINS você preenche no painel (sync:false).
services:
  - type: web
    name: eternia-server
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
